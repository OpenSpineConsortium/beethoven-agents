# Deterministic environment for beethoven-agents, the nested agentic framework of the Beethoven
# engine: the image, the guard, accounts and the orchestration of `claude -p` steps and masters.
# The lock beside this file (pixi.lock) is the record: exact versions, build strings and hashes,
# solved for the grid's platform. A run is only reproducible if it is reconstructed from the lock
# alone, so CI installs with --locked and never re-solves silently.
#
# Scope note: this is the SUBSTRATE env every engine job shares (the image reconstructs it). It
# carries the verification stack beethoven-qa's gate needs, the same lines as beethoven-qa's
# pixi.toml, and nothing else yet. The orchestrator (Metaflow, decision D3) is added as its own pixi
# feature with its own Linear issue; the medical and telemetry stacks belong to the research
# pipeline's study image, layered on this one (plan/REPO_SPLIT.md section 2).

[workspace]
name = "beethoven-agents"
version = "0.0.0"
description = "Beethoven nested agentic framework: substrate image, guard, accounts, orchestration"
channels = ["conda-forge"]
# linux-64 is what runs: the engine runs inside the Apptainer image on the cluster's x86_64 compute
# nodes, and the lock must match the platform a run actually executes on. The three laptop platforms
# were added for bee, the account switch, which runs on the student's own machine as well
# (docs/bee/RUNBOOK.md); adding them left every linux-64 entry of the lock byte for byte as it was
# (checked when they were added, 2026-10-04), so the image and CI reconstruct the same environment.
# linux-64 is named apart from its subdirectory because it states a glibc floor, 2.34, as in
# beethoven-qa's pixi.toml (its 5.0.0): jscpd, the duplication detector, ships manylinux_2_34 wheels
# only. The image (ubuntu:24.04), GitHub's runners and a cloud session all have it; the grid's
# login node never runs the gate. A `[target.linux-64.*]` table still applies under the named entry
# (beethoven-qa measured it with pixi 0.81.0, 2026-10-08).
platforms = [
  { name = "linux-64-glibc234", platform = "linux-64", glibc = "2.34" },
  "win-64",
  "osx-arm64",
  "osx-64",
]
# Same-name derivation is off so the solve does not depend on an external conda<->PyPI mapping
# host. The cost is an overlap the lock does record: CrossHair's PyPI requirements bring PyPI copies
# of packaging, typing-extensions and mypy-extensions beside conda-forge's, at the same versions,
# and `pixi install` warns that the PyPI files overwrite the conda ones. Harmless while the versions
# match; revisit if a lock ever pins them apart.
conda-pypi-map = false

[dependencies]
# Pinned low bounds only; the lock pins the exact build. conda-forge is the primary channel
# (REFORMS prefers it); the two tools that are not packaged there come from PyPI below.
python = "3.11.*"
pip = "*"
# --- Goal 1: contracts and layered runtime types ---
icontract = ">=2.6"      # Design by Contract: @require / @ensure / invariants
pydantic = ">=2"         # external-boundary validation (O(N) coercion)
beartype = ">=0.18"      # internal hot-path checks (amortized O(1))
typeguard = ">=4"        # test-enclave runtime checking
# --- dev tooling the gate runs ---
pytest = ">=8"
ruff = ">=0.6"           # lint + format check
mypy = ">=1.10"          # static types, the layer above the runtime checks
# --- the code standards (beethoven-qa's docs/STANDARDS.md), the same lines as beethoven-qa's
# pixi.toml: each tool runs as its own process and is read through its JSON output; ruff above
# serves the readability group as well, and complexipy is per platform below.
radon = ">=6"            # design: McCabe complexity per method, the weights of WMC
bandit = ">=1.9"         # security: weaknesses mapped to CWE
coverage = ">=7.10"      # coverage: line coverage of the tests, read for the new lines only
pyyaml = ">=6"           # supply chain: the workflow files
types-pyyaml = ">=6"     # mypy's stubs for pyyaml
zizmor = ">=1.30"        # supply chain: the established auditor of the workflow files
lizard = ">=1.24"        # readability: lines of code per function (NLOC)

[pypi-dependencies]
# The symbolic-proof layer. CrossHair is published on PyPI only (not conda-forge); it pulls in
# z3-solver itself, so z3 is not declared separately and there is no conda/PyPI overlap to reconcile.
crosshair-tool = ">=0.0.60"
# The duplication detector (Rabin-Karp over tokens), published on PyPI as a self-contained binary
# wheel for each of the four platforms (manylinux_2_34 on linux-64: the glibc floor above). Read
# through its JSON report.
jscpd = ">=5.4"

# complexipy (readability: cognitive complexity, Campbell, SonarSource) comes from conda-forge
# like the rest, as in beethoven-qa, except on osx-arm64, where conda-forge builds none (checked
# 2026-10-05, complexipy 8.0.1) and the same release's PyPI wheel, which has no dependencies, is
# taken instead. The linux-64 entry, the one the image and CI reconstruct, is beethoven-qa's.
#
# zsh is for the tests alone: tests/bee/test_shell.py sources bee's shell helper under zsh, the
# default shell on macOS, and the gate refuses a test that skips itself where zsh is missing, so
# the environment every lane runs the tests in carries it (beethoven-qa 5.0.0). conda-forge builds
# it for these three platforms and not for win-64.
[target.linux-64.dependencies]
complexipy = ">=8"
zsh = ">=5.9"

[target.win-64.dependencies]
complexipy = ">=8"

[target.osx-64.dependencies]
complexipy = ">=8"
zsh = ">=5.9"

[target.osx-arm64.dependencies]
zsh = ">=5.9"

[target.osx-arm64.pypi-dependencies]
complexipy = ">=8"

[activation]
# The package and the pinned copy of beethoven-qa (vendor/beethoven-qa, docs there: CONSUMING.md),
# imported without a build step. Absolute, so a `pixi run` started outside the root finds them too.
env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src:$PIXI_PROJECT_ROOT/vendor/beethoven-qa/src" }

[tasks]
# The verification gate, in the order a module must clear it. CI calls `pixi run gate`; a developer
# runs the same thing locally, so "passes in CI" and "passes on my machine" cannot diverge.
lint = "ruff check src tests && ruff format --check src tests"
typecheck = "mypy src"
test = "pytest -q"
# beethoven-qa's gate on this package ([tool.beethoven-qa] in pyproject.toml): every public function
# carries contracts, and CrossHair + Z3 find no input that satisfies a precondition while violating
# a postcondition, within the declared bound per condition.
symbolic = "python -m beethoven_qa gate"
# The pinned copy still hashes to its ORIGIN and the kit files equal the copy's.
vendor-check = "python -m beethoven_qa vendor-check"
# The code standards, each group on its own (beethoven-qa's docs/STANDARDS.md), on the code new
# since where this branch left the remote's default branch; CI runs each group as a step of one
# job, `standards (every group green)` (the kit's standards.yml).
standards = "python -m beethoven_qa standards all"
# The interface standard's five rules on what git tracks (the hub's INTERFACES.md, beethoven-qa's
# CONSUMING.md step 2): nothing reaches another checkout, interface/INTERFACE.json names every
# export and pinned copy, each copy holds what its ORIGIN lists, imports take only the published
# surface, and dependence runs one way.
boundary = "python -m beethoven_qa boundary"
gate = { depends-on = ["lint", "typecheck", "test", "boundary", "symbolic", "standards", "vendor-check"] }
# The evidence report (beethoven-qa's docs/REPORT.md): every lane above, each command as its own
# process, written up into report/ (never committed) with who decided each verdict. Not a lane of
# the gate, which it would only run twice.
report = "python -m beethoven_qa report"
# The gate before every push, not only in CI: one command points git at the repository's hooks.
hooks = "git config core.hooksPath .githooks"
# bee, the account switch and the hand-off file (src/beethoven_agents/bee, docs/bee/): the same
# command on a laptop and, through bee-grid.sh, in the image on a compute node.
bee = "python -m beethoven_agents.bee"
